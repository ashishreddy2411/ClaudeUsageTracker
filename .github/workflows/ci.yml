name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run Xcode tests
        run: |
          xcodebuild test \
            -project ClaudeUsageBar.xcodeproj \
            -scheme ClaudeUsageBar \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-"

      - name: Run logic smoke test
        run: swift Scripts/smoke-logic.swift
